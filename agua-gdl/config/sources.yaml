# Medios a revisar. Para cada uno:
#   id        identificador corto
#   name      nombre del medio
#   scope     local | nacional
#   domain    dominio (se usa para buscar en Google Noticias con site:)
#   rss       lista opcional de feeds RSS propios (se filtran por palabras de agua)
#   paywall   true si el sitio suele cortar el texto (se analiza lo que se alcance a bajar)
#
# Los feeds RSS cambian seguido: si alguno falla, `recolectar` lo reporta y sigue con
# los demás. Ajusta esta lista a tu gusto; agregar un medio es agregar un bloque.

sources:
  # ---------- Locales (Jalisco / ZMG) ----------
  - {id: informador,   name: El Informador,        scope: local, domain: informador.mx, rss: ["https://www.informador.mx/rss/jalisco.xml"]}
  - {id: mural,        name: Mural,                scope: local, domain: mural.com, paywall: true}
  - {id: occidental,   name: El Occidental,        scope: local, domain: elOccidental.com.mx}
  - {id: notisistema,  name: Notisistema,          scope: local, domain: notisistema.com}
  - {id: zonadocs,     name: Zona Docs,            scope: local, domain: zonadocs.mx}
  - {id: udgtv,        name: UDG TV,               scope: local, domain: udgtv.com}
  - {id: quadratin,    name: Quadratín Jalisco,    scope: local, domain: jalisco.quadratin.com.mx}
  - {id: ntr,          name: NTR Guadalajara,      scope: local, domain: ntrguadalajara.com}
  - {id: cuatrocinco,  name: Cuatro Cinco,         scope: local, domain: cuatrocinco.com.mx}
  - {id: ljz,          name: La Jornada Jalisco,   scope: local, domain: lajornadajalisco.com.mx}

  # ---------- Nacionales ----------
